name: Release tarballs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact existing tag to build tarballs for (e.g. 0.6.2 or v0.6.2 — must match the pushed tag exactly)."
        required: true
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc*"
      - "v[0-9]*.[0-9]*.[0-9]*-rc*"
      - "[0-9]*.[0-9]*.[0-9]*-RC*"
      - "v[0-9]*.[0-9]*.[0-9]*-RC*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tarballs:
    uses: nikolareljin/ci-helpers/.github/workflows/rust-release-tarballs.yml@production
    with:
      bin_name: "image-view"
      formula_class: "ImageView"
      desc: "Render images directly in your terminal"
      homepage: "https://github.com/nikolareljin/image-view"
      tap_repo: "nikolareljin/homebrew-tap"
      release_tag: ${{ github.event.inputs.release_tag || github.ref_name }}
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

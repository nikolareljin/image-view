name: Homebrew Package

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc*"
      - "[0-9]*.[0-9]*.[0-9]*-RC*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brew:
    uses: nikolareljin/ci-helpers/.github/workflows/homebrew-package.yml@production
    with:
      name: "image-view"
      desc: "Render images directly in your terminal"
      homepage: "https://github.com/nikolareljin/image-view"
      license: "MIT"
      tarball_url: "https://github.com/nikolareljin/image-view/archive/refs/tags/${{ github.ref_name }}.tar.gz"
      formula_path: "packaging/homebrew/image-view.rb"
      deps: ""
      publish: "true"
      tap_repo: "nikolareljin/homebrew-image-view"
      tap_branch: "main"
      tap_dir: "Formula"
    secrets:
      tap_token: ${{ secrets.TAP_TOKEN }}
